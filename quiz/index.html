  --ink:#2a2230;

body{font-family:var(--sans);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:#ffeef3 radial-gradient(#ffc9d9 1.5px,transparent 1.5px) 0 0/22px 22px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{display:block}

.phone{width:390px;height:844px;border-radius:54px;background:#2a2230;padding:12px;box-shadow:0 40px 80px rgba(120,40,70,.25);flex:none}
.app{width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;background:var(--paper)}

.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .4s}
.view.on{opacity:1;pointer-events:auto}

.cover{background:linear-gradient(180deg,#ffd6e3 0%,#fff1c9 100%);align-items:center;text-align:center;padding:70px 26px 40px;overflow:hidden}
.cover .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.6}
.cover .b1{width:200px;height:200px;background:#ffb3c9;top:-60px;left:-60px}
.cover .b2{width:160px;height:160px;background:#ffe27a;bottom:120px;right:-50px}
.cover .badge{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:4px 14px;font-size:13px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transform:rotate(-3deg)}
.cover h1{position:relative;font-family:var(--fun);font-weight:400;font-size:46px;line-height:1.2;margin-top:22px;color:var(--ink);text-shadow:3px 3px 0 #fff}
.cover h1 span{color:var(--pink);display:block;font-size:56px;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.cover .sub{position:relative;margin-top:12px;font-size:14px;color:#6b5a66}
.cups{position:relative;height:250px;width:100%;margin:10px 0}
.cups .c{position:absolute;width:96px;animation:float 3s ease-in-out infinite}
.cups .c svg{width:100%}
.cups .c:nth-child(1){left:2px;top:60px;transform:rotate(-12deg);animation-delay:-.4s}
.cups .c:nth-child(2){left:50%;top:10px;width:128px;margin-left:-64px;animation-delay:-1.2s}
.cups .c:nth-child(3){right:2px;top:66px;transform:rotate(12deg);animation-delay:-2s}
.cups .c:nth-child(4){left:56px;top:162px;width:70px;transform:rotate(8deg);animation-delay:-.8s}
.cups .c:nth-child(5){right:58px;top:166px;width:70px;transform:rotate(-8deg);animation-delay:-1.6s}
@keyframes float{50%{translate:0 -12px}}
.cta{display:block;text-align:center;text-decoration:none;position:relative;width:100%;padding:17px;border-radius:30px;background:var(--pink);color:#fff;font-family:var(--fun);font-size:24px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s;letter-spacing:2px}
.cta:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.cta.alt{background:#fff;color:var(--ink)}
.joined{position:relative;margin-top:16px;font-size:13px;color:#6b5a66;display:flex;align-items:center;gap:8px}
.joined .av{display:flex}
.joined .av i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;margin-left:-7px}
.joined b{color:var(--ink)}

.quiz{background:var(--paper);padding:58px 22px 30px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .qn{font-family:var(--fun);font-size:22px}
.qtop .qn small{font-size:15px;color:#a4949f}
.bar{flex:1;height:14px;border-radius:7px;border:2.5px solid var(--ink);background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#ff96b6 8px 16px);transition:width .4s;border-right:2.5px solid var(--ink)}
.qcard{margin-top:30px;transition:transform .35s,opacity .35s}
.qcard.out{transform:translateX(-40px);opacity:0}
.qcard.in{transform:translateX(40px);opacity:0;transition:none}
.qemo{width:88px;height:88px;border-radius:26px;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;margin-bottom:22px;transform:rotate(-4deg)}
.qcard h2{font-family:var(--fun);font-weight:400;font-size:28px;line-height:1.35}
.opts{margin-top:28px;display:grid;gap:14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:15px 16px;font-size:16px;font-weight:600;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.opt:active,.opt.pick{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.opt.pick{background:var(--yellow)}
.opt b{flex:none;width:32px;height:32px;border-radius:10px;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--fun);font-weight:400;font-size:17px}
.opt:nth-child(1) b{background:#ffd6e3}.opt:nth-child(2) b{background:#fff0b3}.opt:nth-child(3) b{background:#c9f2e6}.opt:nth-child(4) b{background:#e6dcff}
.qback{margin-top:auto;align-self:center;font-size:14px;color:#a4949f;display:flex;gap:4px;align-items:center;padding:8px}

.mix{background:linear-gradient(180deg,#fff1c9,#ffd6e3);align-items:center;justify-content:center;text-align:center}
.shaker{width:120px;animation:shake .35s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes shake{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.mix h3{font-family:var(--fun);font-weight:400;font-size:26px;margin-top:30px}
.mix p{font-size:14px;color:#6b5a66;margin-top:8px;height:20px}
.mix .dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin:16px 4px 0;animation:dot 1s infinite}
.mix .dots i:nth-child(2){animation-delay:.15s}.mix .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-8px)}}

.result{background:var(--theme-l);overflow-y:auto;padding:52px 20px 30px}
.result::-webkit-scrollbar{display:none}
.poster{background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;animation:rise .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(40px) scale(.95);opacity:0}}
.ph{background:var(--theme);padding:22px 20px 0;position:relative;text-align:center;overflow:hidden;border-bottom:3px solid var(--ink)}
.ph::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2px) 0 0/18px 18px}
.ph small{position:relative;font-size:13px;color:#fff;font-weight:700;letter-spacing:2px;background:var(--ink);padding:3px 12px;border-radius:12px}
.ph h2{position:relative;font-family:var(--fun);font-weight:400;font-size:44px;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);margin-top:10px;line-height:1.2}
.ph .cupbig{position:relative;width:150px;margin:6px auto -6px;animation:float 3s ease-in-out infinite}
.ph .sun{position:absolute;left:50%;bottom:-70px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:rgba(255,255,255,.3)}
.pb{padding:20px 20px 22px}
.kw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.kw span{border:2px solid var(--ink);border-radius:14px;padding:3px 12px;font-size:13px;font-weight:700;background:var(--theme-l)}
.desc{font-size:14.5px;line-height:1.85;margin-top:16px;color:#4b3f48;text-align:justify}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.meta div{border:2px solid var(--ink);border-radius:16px;padding:10px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.meta svg{width:30px;flex:none}
.meta small{display:block;font-size:11px;color:#8f7f8a}
.meta b{font-size:15px}
.meta .pct{font-family:var(--fun);font-size:26px;font-weight:400;line-height:1;color:var(--theme);-webkit-text-stroke:.8px var(--ink)}
.sig{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:2px dashed #e5d9df;font-size:12px;color:#8f7f8a}
.sig b{font-family:var(--fun);font-weight:400;font-size:16px;color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.acts .cta{font-size:19px;padding:13px}

.modal{position:absolute;inset:0;background:rgba(42,34,48,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;opacity:0;pointer-events:none;transition:opacity .3s;padding:30px}
.modal.on{opacity:1;pointer-events:auto}
.modal img{max-width:100%;max-height:72%;border-radius:18px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.modal p{color:#fff;font-size:14px}
.modal .row{display:flex;gap:12px}
.modal .row .cta{font-size:16px;padding:10px 22px;width:auto}

  {q:'理想的旅行方式是？',e:'#fff0b3',o:[['海边发呆一整天','mango'],['特种兵式打卡','lemon'],['提前做好详细攻略','coco'],['酒店躺平也算旅行','taro']]},
  {q:'心情不好的时候，你会？',e:'#c9f2e6',o:[['吃顿好的就好了','pearl'],['找朋友吐槽一通','lemon'],['一个人安静待着','taro'],['戴上耳机出去走走','mango']]},
  {q:'如果能拥有一个超能力？',e:'#e6dcff',o:[['瞬间移动','lemon'],['时间暂停','coco'],['治愈别人','mango'],['回到过去的某一天','pearl']]}
];
const ICONS=[
  '<path d="M6 30h36v8a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4z" fill="#ff9fbd" stroke="#2a2230" stroke-width="2.5"/><path d="M10 30V18a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v12" fill="#fff" stroke="#2a2230" stroke-width="2.5"/><circle cx="19" cy="22" r="2" fill="#2a2230"/><circle cx="29" cy="22" r="2" fill="#2a2230"/>',
  '<circle cx="24" cy="26" r="15" fill="#fff" stroke="#2a2230" stroke-width="2.5"/><path d="M24 17v9l6 4" stroke="#2a2230" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M14 8l-5 5M34 8l5 5" stroke="#2a2230" stroke-width="2.5" stroke-linecap="round"/>',
  '<rect x="13" y="5" width="22" height="38" rx="5" fill="#fff" stroke="#2a2230" stroke-width="2.5"/><circle cx="24" cy="21" r="6" fill="#ffd23f" stroke="#2a2230" stroke-width="2"/><path d="M17 34h14" stroke="#2a2230" stroke-width="2.5" stroke-linecap="round"/>',
  '<path d="M8 18h32l-3 22a4 4 0 0 1-4 3H15a4 4 0 0 1-4-3z" fill="#fff" stroke="#2a2230" stroke-width="2.5"/><path d="M15 18c0-6 4-10 9-10s9 4 9 10" fill="none" stroke="#2a2230" stroke-width="2.5"/><circle cx="24" cy="30" r="4" fill="#ff9fbd" stroke="#2a2230" stroke-width="2"/>',
  '<path d="M24 41s-16-9-16-21a8 8 0 0 1 16-3 8 8 0 0 1 16 3c0 12-16 21-16 21z" fill="#ff9fbd" stroke="#2a2230" stroke-width="2.5"/>',
  '<path d="M6 34h36" stroke="#2a2230" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="34" r="11" fill="#ffd23f" stroke="#2a2230" stroke-width="2.5"/><path d="M6 34h36v8H6z" fill="#7fc8f0" stroke="#2a2230" stroke-width="2.5"/><path d="M24 12v5M10 18l4 3M38 18l-4 3" stroke="#2a2230" stroke-width="2.5" stroke-linecap="round"/>',
  '<path d="M10 30a10 10 0 0 1 2-19 12 12 0 0 1 22 2 8 8 0 0 1 4 15z" fill="#fff" stroke="#2a2230" stroke-width="2.5"/><path d="M16 36l-2 5M24 36l-2 5M32 36l-2 5" stroke="#7fc8f0" stroke-width="3" stroke-linecap="round"/>',
  '<path d="M24 5l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z" fill="#ffd23f" stroke="#2a2230" stroke-width="2.5" stroke-linejoin="round"/>'
];

let uid=0;
function cupSVG(c){
  const u='c'+(++uid),tl=14,tr=86,bl=24,br=76,top=34,bot=118,fillTop=44;
  let s=`<svg viewBox="0 0 100 124"><defs><linearGradient id="${u}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.liq[0]}"/><stop offset="1" stop-color="${c.liq[1]}"/></linearGradient><clipPath id="${u}k"><path d="M${tl} ${top}L${tr} ${top}L${br} ${bot}Q50 ${bot+4} ${bl} ${bot}Z"/></clipPath></defs>`;
  s+=`<path d="M60 3 L52 44" stroke="#2a2230" stroke-width="9" stroke-linecap="round"/><path d="M60 3 L52 44" stroke="#ff7aa2" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<g clip-path="url(#${u}k)"><rect x="0" y="${top}" width="100" height="90" fill="#fff"/><rect x="0" y="${fillTop}" width="100" height="90" fill="url(#${u}g)"/>`;
  if(c.bottom){const h=(bot-fillTop)*c.bh;const y=c.flip?fillTop:bot-h;s+=`<rect x="0" y="${y}" width="100" height="${h+(c.flip?0:6)}" fill="${c.bottom}"/>`;s+=c.flip?`<path d="M0 ${y+h} Q25 ${y+h+4} 50 ${y+h} T100 ${y+h} V${y+h-2} H0Z" fill="${c.bottom}"/>`:`<path d="M0 ${y} Q25 ${y-4} 50 ${y} T100 ${y}" fill="${c.bottom}"/>`}
  if(c.pearl)[[30,110],[42,112],[54,111],[66,110],[36,102],[48,103],[60,102],[72,104],[28,104],[42,95],[55,95],[66,96]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="5" fill="#3a2418"/><circle cx="${x-1.6}" cy="${y-1.6}" r="1.4" fill="#fff" opacity=".4"/>`);
  if(c.sago)for(let i=0;i<22;i++){const x=24+(i*37)%54,y=64+(i*23)%48;s+=`<circle cx="${x}" cy="${y}" r="2.6" fill="#fff" opacity=".9"/>`}
  if(c.dots)for(let i=0;i<9;i++){const x=28+(i*29)%46,y=72+(i*17)%40;s+=`<ellipse cx="${x}" cy="${y}" rx="3.4" ry="2" fill="${c.dots}" transform="rotate(${i*40} ${x} ${y})"/>`}
  if(c.lemon)[[38,80],[62,96],[46,108]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="10" fill="#fff6b0" stroke="#f5d33a" stroke-width="2.5"/><path d="M${x} ${y-8}V${y+8}M${x-8} ${y}H${x+8}" stroke="#f5d33a" stroke-width="1.2"/>`);
  for(let i=0;i<4;i++){const x=26+i*14,y=fillTop+4+(i%2)*6;s+=`<rect x="${x}" y="${y}" width="10" height="10" rx="2" fill="#fff" opacity=".55" transform="rotate(${i*20+10} ${x+5} ${y+5})"/>`}
  s+=`<rect x="10" y="${top}" width="9" height="90" fill="#fff" opacity=".35" transform="skewX(6)"/></g>`;
  s+=`<path d="M${tl} ${top}L${tr} ${top}L${br} ${bot}Q50 ${bot+4} ${bl} ${bot}Z" fill="none" stroke="#2a2230" stroke-width="3" stroke-linejoin="round"/>`;
  s+=`<rect x="9" y="${top-7}" width="82" height="8" rx="4" fill="#fff" stroke="#2a2230" stroke-width="3"/>`;
  s+=`<circle cx="40" cy="74" r="2.6" fill="#2a2230"/><circle cx="60" cy="74" r="2.6" fill="#2a2230"/><path d="M45 79q5 4 10 0" stroke="#2a2230" stroke-width="2.4" fill="none" stroke-linecap="round"/><ellipse cx="34" cy="80" rx="4" ry="2.4" fill="#ff7aa2" opacity=".6"/><ellipse cx="66" cy="80" rx="4" ry="2.4" fill="#ff7aa2" opacity=".6"/>`;
  return s+'</svg>';
}

const $=s=>document.querySelector(s);
const ORDER=['mango','coco','lemon','taro','pearl'];
$('#coverCups').innerHTML=['lemon','mango','taro','coco','pearl'].map(k=>`<div class="c">${cupSVG(R[k].cup)}</div>`).join('');
$('#shaker').innerHTML=cupSVG({liq:['#ffc9d9','#ff7aa2'],pearl:1});

let n=128604;setInterval(()=>{n+=Math.floor(Math.random()*3);$('#cnt').textContent=n.toLocaleString()},1800);

function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id))}

let idx=0,ans=[];
$('#start').onclick=()=>{idx=0;ans=[];renderQ(false);show('vQuiz')};
function renderQ(anim=true){
  const q=Q[idx],card=$('#qcard');
  const paint=()=>{
    $('#qn').innerHTML=`${idx+1}<small>/${Q.length}</small>`;
    $('#bar').style.width=(idx/Q.length*100)+'%';
    card.innerHTML=`<div class="qemo" style="background:${q.e}"><svg width="52" height="52" viewBox="0 0 48 48">${ICONS[idx]}</svg></div><h2>${q.q}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt ${ans[idx]===i?'pick':''}" data-i="${i}"><b>${'ABCD'[i]}</b>${o[0]}</button>`).join('')}</div>`;
    $('#qback').style.visibility=idx?'visible':'hidden';
  };
  if(!anim)return paint();
  card.classList.add('out');
  setTimeout(()=>{paint();card.classList.remove('out');card.classList.add('in');void card.offsetWidth;card.classList.remove('in')},300);
}
let busy=false;
$('#qcard').onclick=e=>{
  const b=e.target.closest('.opt');if(!b||busy)return;
  busy=true;b.classList.add('pick');ans[idx]=+b.dataset.i;
  $('#bar').style.width=((idx+1)/Q.length*100)+'%';
  setTimeout(()=>{busy=false;if(idx<Q.length-1){idx++;renderQ()}else mix()},380);
};
$('#qback').onclick=()=>{if(idx>0&&!busy){idx--;renderQ()}};

function mix(){
  show('vMix');
  const tips=['正在加冰……','正在调整甜度……','正在摇匀你的性格……','马上就好！'];
  let t=0;$('#mixTip').textContent=tips[0];
  const iv=setInterval(()=>{t++;if(t<tips.length)$('#mixTip').textContent=tips[t]},600);
  setTimeout(()=>{clearInterval(iv);result()},2400);
}
function score(){
  const s={};ORDER.forEach(k=>s[k]=0);
  ans.forEach((a,i)=>s[Q[i].o[a][1]]++);
  return ORDER.reduce((best,k)=>s[k]>s[best]?k:best,ORDER[0]);
}
let curKey;
function result(){
  curKey=score();const r=R[curKey],m=R[r.mate];
  const app=$('#app');app.style.setProperty('--theme',r.theme);app.style.setProperty('--theme-l',r.light);
  $('#vResult').innerHTML=`
    <div class="poster">
      <div class="ph"><div class="sun"></div><small>你的奶茶人格是</small><h2>${r.name}</h2><div class="cupbig">${cupSVG(r.cup)}</div></div>
      <div class="pb">
        <div class="kw">${r.kw.map(k=>`<span>${k}</span>`).join('')}</div>
        <p class="desc">${r.desc}</p>
        <div class="meta">
          <div><span class="pct">${r.rare}%</span><span><small>稀有度</small><b>和你一样</b></span></div>
          <div>${cupSVG(m.cup)}<span><small>最配搭子</small><b>${m.name}</b></span></div>
        </div>
        <div class="sig"><span>分享给朋友，看看 TA 是哪杯</span><b>测测你是哪杯奶茶</b></div>
      </div>
    </div>
    <div class="acts"><button class="cta" id="save">保存海报</button><button class="cta alt" id="again">再测一次</button></div>`;
  show('vResult');$('#vResult').scrollTop=0;
  $('#again').onclick=()=>show('vCover');
  $('#save').onclick=makePoster;
}

function svgImg(svg){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '))})}
function lines(ctx,text,w){const out=[];let line='';for(const ch of text){if(ctx.measureText(line+ch).width>w){out.push(line);line=ch}else line+=ch}out.push(line);return out}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
async function makePoster(){
  const r=R[curKey],m=R[r.mate],W=750,c=document.createElement('canvas');
  const sans0='"PingFang SC","Microsoft YaHei",sans-serif';const mx=c.getContext('2d');mx.font=`28px ${sans0}`;const dl=lines(mx,r.desc,W-200);
  const H=690+(dl.length-1)*50+50+250+52;c.width=W;c.height=H;
  const x=c.getContext('2d'),ink='#2a2230',fun='"ZCOOL KuaiLe","Microsoft YaHei",sans-serif',sans='"PingFang SC","Microsoft YaHei",sans-serif';
  x.fillStyle=r.light;x.fillRect(0,0,W,H);
  x.fillStyle=ink;rr(x,52,52,W-92,H-92,44);x.fill();
  x.fillStyle='#fff';rr(x,40,40,W-92,H-92,44);x.fill();x.lineWidth=6;x.strokeStyle=ink;x.stroke();
  x.save();rr(x,40,40,W-92,500,44);x.clip();x.fillStyle=r.theme;x.fillRect(40,40,W-92,500);
  x.fillStyle='rgba(255,255,255,.3)';for(let i=0;i<W;i+=34)for(let j=40;j<540;j+=34){x.beginPath();x.arc(i,j,3.5,0,7);x.fill()}
  x.beginPath();x.arc(W/2-6,640,240,0,7);x.fill();x.restore();
  x.beginPath();x.moveTo(40,540);x.lineTo(W-52,540);x.stroke();
  x.textAlign='center';x.font=`bold 26px ${sans}`;const tag='你的奶茶人格是',tw=x.measureText(tag).width+40;
  x.fillStyle=ink;rr(x,W/2-6-tw/2,80,tw,46,23);x.fill();x.fillStyle='#fff';x.fillText(tag,W/2-6,112);
  x.font=`92px ${fun}`;x.lineJoin='round';x.lineWidth=10;x.strokeStyle=ink;x.fillStyle=ink;x.fillText(r.name,W/2,232);x.strokeText(r.name,W/2-6,226);x.fillStyle='#fff';x.fillText(r.name,W/2-6,226);
  const cup=await svgImg(cupSVG(r.cup));x.drawImage(cup,W/2-6-125,255,250,310);
  x.font=`bold 26px ${sans}`;let kx=0;const kws=r.kw.map(k=>({k,w:x.measureText(k).width+40}));const tot=kws.reduce((s,k)=>s+k.w,0)+(kws.length-1)*16;kx=W/2-6-tot/2;
  kws.forEach(({k,w})=>{x.fillStyle=r.light;rr(x,kx,580,w,48,24);x.fill();x.lineWidth=4;x.strokeStyle=ink;x.stroke();x.fillStyle=ink;x.fillText(k,kx+w/2,613);kx+=w+16});
  x.textAlign='left';x.font=`28px ${sans}`;x.fillStyle='#4b3f48';dl.forEach((l,i)=>x.fillText(l,90,690+i*50));const ey=690+(dl.length-1)*50;
  const by=ey+50;x.lineWidth=4;x.strokeStyle=ink;
  rr(x,90,by,270,120,28);x.stroke();rr(x,384,by,270,120,28);x.stroke();
  x.font=`64px ${fun}`;x.fillStyle=r.theme;x.fillText(r.rare+'%',112,by+82);x.lineWidth=1.5;x.strokeText(r.rare+'%',112,by+82);
  x.font=`22px ${sans}`;x.fillStyle='#8f7f8a';x.fillText('稀有度',245,by+52);x.font=`bold 24px ${sans}`;x.fillStyle=ink;x.fillText('和你一样',245,by+86);
  const mc=await svgImg(cupSVG(m.cup));x.drawImage(mc,400,by+14,74,92);
  x.font=`22px ${sans}`;x.fillStyle='#8f7f8a';x.fillText('最配你的搭子',486,by+52);x.font=`bold 28px ${sans}`;x.fillStyle=ink;x.fillText(m.name,486,by+88);
  x.setLineDash([10,8]);x.strokeStyle='#e5d9df';x.lineWidth=3;x.beginPath();x.moveTo(90,by+160);x.lineTo(W-110,by+160);x.stroke();x.setLineDash([]);
  x.font=`22px ${sans}`;x.fillStyle='#8f7f8a';x.fillText('分享给朋友，看看 TA 是哪杯',90,by+205);x.textAlign='right';x.font=`30px ${fun}`;x.fillStyle=ink;x.fillText('测测你是哪杯奶茶',W-110,by+207);
  const url=c.toDataURL('image/png');$('#posterImg').src=url;$('#dl').href=url;$('#modal').classList.add('on');
}
$('#mClose').onclick=()=>$('#modal').classList.remove('on');
</script>
